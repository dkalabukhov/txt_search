line-length = 80

[lint]
preview = true
select = ["E", "F", "I", "C90", "UP", "B", "S", "FURB", "RUF"]
ignore = ["ambiguous-unicode-character-string", "ambiguous-unicode-character-docstring", "ambiguous-unicode-character-comment"]

[lint.per-file-ignores]
"__init__.py" = ["unused-import"]
"tests/**" = ["assert"]