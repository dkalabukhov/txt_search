[project]
name = "txt-search"
version = "0.1.0"
description = "A simple console utility to search for a word in .txt files"
readme = "README.md"
authors = [
    { name = "dkalabukhov", email = "daniil.kalabukhov@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "inquirerpy>=0.3.4",
]

[project.scripts]
txt-search = "txt_search:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
